[project]
name = "qwen-voice-studio-local"
version = "3.6.0"
description = "Local-first Qwen3-TTS workspace with a lean browser UI"
requires-python = ">=3.12,<3.14"
# Backend/CUDA selection is intentionally not resolved by `uv sync`.
# install.ps1 manages the existing Torch CUDA build and installs UI + official Qwen runtime requirements.
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3", "numpy>=1.26,<3", "soundfile>=0.12,<1", "psutil>=5.9,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = false
